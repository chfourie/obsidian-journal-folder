name: Release Obsidian plugin

on:
    push:
        tags:
            - "*"

jobs:
    build:
        runs-on: ubuntu-latest

        # contents: write — gh release create; id-token + attestations —
        # actions/attest-build-provenance (the community-review scanner checks
        # release assets for artifact attestations).
        permissions:
            contents: write
            id-token: write
            attestations: write

        steps:
            -   uses: actions/checkout@v6

            -   name: Use Node.js
                uses: actions/setup-node@v6
                with:
                    node-version: "20.x"

            -   name: Build plugin
                run: |
                    npm install --force
                    npm run build

            -   name: Attest build provenance
                uses: actions/attest-build-provenance@v4
                with:
                    subject-path: |
                        main.js
                        manifest.json
                        styles.css

            -   name: Extract release notes
                run: |
                    tag="${GITHUB_REF#refs/tags/}"
                    awk -v tag="$tag" '
                      $0 ~ "^## \\["tag"\\]" {flag=1; next}
                      /^## \[/ && flag {exit}
                      flag {print}
                    ' CHANGELOG.md > RELEASE_NOTES.md
                    if [ ! -s RELEASE_NOTES.md ]; then
                      echo "No CHANGELOG.md section found for $tag" >&2
                      echo "Release $tag" > RELEASE_NOTES.md
                    fi

            -   name: Create release
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    tag="${GITHUB_REF#refs/tags/}"

                    gh release create "$tag" \
                      --title="$tag" \
                      --draft \
                      --notes-file RELEASE_NOTES.md \
                      main.js manifest.json styles.css
